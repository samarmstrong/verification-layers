# Seed-2 exploratory arm: identical to vl-a-plain.yaml, run against specs with the worked
# I/O examples removed (scripts/vl_strip_examples.py). The stripping is not in this file:
# run it through scripts/vl_seed.sh with VL_STRIPPED_ARMS set, which points
# SCBENCH_PROBLEMS_PATH at the stripped copy. Run directly, it gets the full specs.
# Verification-layers instrument, arm A. Plain Claude Code: the bench's own prompt, no verification instruction.
# Same model, effort, agent version, environment and problems in every arm.
# Problems: 20 of 36, random.Random(42).sample(sorted(catalog v1.0), 20).
agent: claude_code_vl
environment: docker-python3.12-uv
prompt: just-solve
model:
  provider: vertex
  name: sonnet-5.5
thinking: medium
review:
  enabled: false
save_dir: outputs
save_template: vl/a-plain-stripped/${model.name}_${thinking}/${now:%Y%m%dT%H%M}
problems:
  - cfgpipe
  - circuit_eval
  - code_search
  - dag_execution
  - database_migration
  - dynamic_buffer
  - dynamic_config_service_api
  - eve_route_planner
  - execution_server
  - file_backup
  - file_merger
  - file_query_tool
  - forge
  - log_query
  - metric_transform_lang
  - migrate_configs
  - rejector
  - textdrop
  - trajectory_api
  - xjq
